name: 本体（d2u.js）の自動ビルド
# src/deck2untap.js などを GitHub 上で直して保存（Commit）すると、
# d2u.js を作り直して自動でコミットする。GitHub Pages にもそのまま反映される。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'tools/build.mjs'
      - 'package.json'
  workflow_dispatch:      # 「Run workflow」ボタンで手動実行
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund lz-string@^1.5.0 terser@^5
      - name: d2u.js を作る
        run: node tools/build.mjs
      - name: 作った d2u.js が壊れていないか確認
        run: |
          node -e "new Function(require('fs').readFileSync('d2u.js','utf8'))"
          test $(wc -c < d2u.js) -gt 30000
      - name: テスト（あれば）
        run: |
          if [ -d test ]; then npm test; else echo "test フォルダなし（スキップ）"; fi
      - name: 変わっていればコミット
        run: |
          if git diff --quiet -- d2u.js; then echo "d2u.js に変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          VER=$(grep -oP "C2U_VER = '\K[^']+" src/deck2untap.js || echo '?')
          git add d2u.js
          git commit -m "d2u.js を自動ビルド（$VER）"
          git push
